name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write
  packages: write
  # Keyless signing: Sigstore issues the signing certificate for this job's OIDC token.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}  # Explicit token for private repo

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Run tests
        run: make test-unit

      - name: Read pinned golangci-lint version
        id: lintver
        # Same pin as CI; single source of truth is GOLANGCI_LINT_VERSION in the Makefile.
        run: |
          v=$(sed -n 's/^GOLANGCI_LINT_VERSION *?= *//p' Makefile)
          test -n "$v" || { echo "GOLANGCI_LINT_VERSION not found in Makefile"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lintver.outputs.version }}
          args: --config .golangci.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tns-csi
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Update Helm chart versions
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Update Chart.yaml with new versions
          sed -i "s/^version:.*/version: ${VERSION#v}/" charts/tns-csi-driver/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/tns-csi-driver/Chart.yaml
          # Update values.yaml with new image tag (only the main image.tag, not sidecars)
          # The main image.tag has empty value "", sidecars have specific versions
          sed -i 's/^  tag: ""$/  tag: "'"${VERSION}"'"/' charts/tns-csi-driver/values.yaml

      - name: Package Helm chart
        run: |
          helm package charts/tns-csi-driver -d .helm-releases

      - name: Render plain manifest for Kustomize users
        run: |
          helm template tns-csi charts/tns-csi-driver \
            --namespace tns-csi \
            --set truenas.url="wss://TRUENAS_IP/api/current" \
            --set truenas.apiKey="REPLACE_WITH_API_KEY" \
            --set storageClasses[0].name=tns-csi-nfs \
            --set storageClasses[0].enabled=true \
            --set storageClasses[0].protocol=nfs \
            --set storageClasses[0].server="TRUENAS_IP" \
            --set storageClasses[0].pool="tank" \
            --set storageClasses[1].name=tns-csi-nvmeof \
            --set storageClasses[1].enabled=true \
            --set storageClasses[1].protocol=nvmeof \
            --set storageClasses[1].server="TRUENAS_IP" \
            --set storageClasses[1].pool="tank" \
            --set storageClasses[2].name=tns-csi-iscsi \
            --set storageClasses[2].enabled=true \
            --set storageClasses[2].protocol=iscsi \
            --set storageClasses[2].server="TRUENAS_IP" \
            --set storageClasses[2].pool="tank" \
            --set snapshots.enabled=true \
            > .helm-releases/tns-csi-driver-${{ steps.version.outputs.version }}.yaml

      # Each push prints the chart's manifest digest, which the signing step needs.
      - name: Push Helm chart to Docker Hub (OCI)
        id: chart-dockerhub
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CHART_VERSION=${VERSION#v}
          echo ${{ secrets.DOCKERHUB_TOKEN }} | helm registry login registry-1.docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          out=$(helm push ".helm-releases/tns-csi-driver-${CHART_VERSION}.tgz" oci://registry-1.docker.io/${{ secrets.DOCKERHUB_USERNAME }})
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          test -n "$digest" || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR (OCI)
        id: chart-ghcr
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CHART_VERSION=${VERSION#v}
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          out=$(helm push ".helm-releases/tns-csi-driver-${CHART_VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          test -n "$digest" || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow and tag, which is what users verify
      # against. Each registry stores its own copy of the signature.
      - name: Sign images and Helm charts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tns-csi
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          DOCKERHUB_CHART: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tns-csi-driver@${{ steps.chart-dockerhub.outputs.digest }}
          GHCR_CHART: ghcr.io/${{ github.repository_owner }}/charts/tns-csi-driver@${{ steps.chart-ghcr.outputs.digest }}
        run: |
          cosign sign --yes \
            "${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}" \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            "${DOCKERHUB_CHART}" \
            "${GHCR_CHART}"

      # SLSA build provenance, stored in the registries so admission controllers can read it
      # next to the image. Storage records exist only for organization-owned repositories.
      - name: Attest image provenance (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image provenance (Docker Hub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tns-csi
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The chart tarball is the same file the OCI charts carry, so this also covers
      # `helm pull` downloads.
      - name: Attest release file provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .helm-releases/*

      - name: Generate changelog with git-cliff
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Include version-specific release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="docs/releases/${RELEASE_VERSION}.md"
          if [ -f "$NOTES" ]; then
            { cat "$NOTES"; printf '\n\n'; cat CHANGELOG.md; } > CHANGELOG.with-notes.md
            mv CHANGELOG.with-notes.md CHANGELOG.md
          fi

      - name: Append installation instructions
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat >> CHANGELOG.md << EOF

          ## Installation

          ### Using Docker
          \`\`\`bash
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tns-csi:${VERSION}
          \`\`\`

          ### Using Helm (Docker Hub)
          \`\`\`bash
          helm install tns-csi oci://registry-1.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tns-csi-driver --version ${VERSION#v} --namespace tns-csi --create-namespace
          \`\`\`

          ### Using Helm (GitHub Container Registry)
          \`\`\`bash
          helm install tns-csi oci://ghcr.io/${{ github.repository_owner }}/charts/tns-csi-driver --version ${VERSION#v} --namespace tns-csi --create-namespace
          \`\`\`

          ### Using Kustomize
          Create the \`tns-csi\` namespace, then download the plain manifest from this release (\`tns-csi-driver-${VERSION}.yaml\`) and use it as a Kustomize base. Replace \`TRUENAS_IP\` and \`REPLACE_WITH_API_KEY\` placeholders with your values, and remove any storage classes you don't need.

          For detailed installation instructions, see the [README](https://github.com/${{ github.repository }}/blob/${VERSION}/README.md).

          ### Verifying
          The images and Helm charts are signed with cosign (keyless) and carry SLSA build provenance. See [Verifying release artifacts](https://github.com/${{ github.repository }}/blob/${VERSION}/SECURITY.md#verifying-release-artifacts).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            .helm-releases/*.tgz
            .helm-releases/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
