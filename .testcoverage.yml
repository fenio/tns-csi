# Coverage ratchet for vladopajic/go-test-coverage (run locally: make coverage-check).
#
# Two gates:
#   1. Floors below: total and per-package minimums. They only ever go UP.
#      When a package's coverage rises, raise its floor to (new value - 1) in the
#      same PR. Never lower a floor; add tests instead.
#   2. Diff vs main (CI only): a PR may not reduce total coverage relative to the
#      latest main build, beyond a 0.5-point noise tolerance (COVERAGE_DIFF_THRESHOLD).
#
# Baseline measured 2026-10-10 in CI (ubuntu-latest) and locally; CI runs lower for
# timing/environment-dependent paths, so floors follow the CI numbers:
#   total ~32%, pkg/driver 44.3%, pkg/tnsapi 39.5%, pkg/retry 94.0%,
#   pkg/metrics 71.4%, pkg/mount 58.7%, cmd/kubectl-tns-csi 2.3-2.6%,
#   pkg/dashboard 0%, cmd/tns-csi-driver 0%.
# Floors sit ~1-1.5 points below to absorb that noise.

profile: coverage.out

threshold:
  # Per-file floors are not enforced yet (many small files are untested).
  file: 0
  # Packages not listed under override (pkg/dashboard, cmd/tns-csi-driver) have no floor yet.
  package: 0
  total: 30

override:
  # First match wins, so keep specific paths before general ones.
  - path: ^pkg/driver$
    threshold: 43
  - path: ^pkg/tnsapi$
    threshold: 38
  - path: ^pkg/retry$
    threshold: 92
  - path: ^pkg/metrics$
    threshold: 70
  - path: ^pkg/mount$
    threshold: 57
  - path: ^cmd/kubectl-tns-csi$
    threshold: 2

exclude:
  paths:
    - _test\.go$
    - ^tests/
